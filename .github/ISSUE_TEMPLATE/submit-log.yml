name: Submit a log
description: Share a Matrix Online chat log or event transcript
title: "Log submission: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping preserve the archive. This issue and its attachments are public. Please remove private or sensitive information before submitting.
  - type: input
    id: author
    attributes:
      label: Author or submitter name
      description: Who created or is submitting this log?
      placeholder: Name or in-game handle
    validations:
      required: true
  - type: input
    id: event-date
    attributes:
      label: Event date
      description: Use the date the log was recorded, if known.
      placeholder: YYYY-MM-DD or unknown
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Archive category
      description: Choose the closest fit.
      options:
        - Chapter 1.1
        - Chapter 1.2
        - Chapter 1.3
        - Chapter 2.1
        - Chapter 2.2
        - Chapter 2.3
        - Chapter 3.1
        - Chapter 3.2
        - Chapter 3.3
        - Chapter 4.1
        - Chapter 4.2
        - Chapter 4.3
        - Chapter 5.1
        - Chapter 5.2
        - Chapter 5.3
        - Chapter 6.1
        - Chapter 6.2
        - Chapter 6.3
        - Chapter 7.1
        - Chapter 7.2
        - Chapter 7.3
        - Chapter 8.1
        - Chapter 8.2
        - Chapter 8.3
        - Chapter 9.1
        - Chapter 9.2
        - Chapter 9.3
        - Chapter 10.1
        - Chapter 10.2
        - Chapter 10.3
        - Chapter 11.1
        - Chapter 11.2
        - Chapter 11.3
        - Chapter 12.1
        - Chapter 12.1 and Beyond
        - Character Details
        - Commandos
        - Guidebook Details
        - Items Details
        - Miscellaneous Documents
        - NPC Dialogue
        - Player Events / Other Logs
        - Special Events
        - Unarchived Missions
        - Other / not sure
    validations:
      required: true
  - type: input
    id: log-title
    attributes:
      label: Suggested log title
      description: A short, descriptive title for the archive.
      placeholder: Brief event or conversation title
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Brief description
      description: Add context that will help the archive maintainer review and organize the log.
      placeholder: What does this log cover?
    validations:
      required: true
  - type: textarea
    id: log-text
    attributes:
      label: Log text (optional)
      description: Paste the log here if it is short. For longer logs, create the issue and attach a .txt file in a follow-up comment.
      render: text
      placeholder: Paste the transcript here
    validations:
      required: false
